name: Frontend CI

on:
  push:
    branches: dev
    paths: &frontend-ci-paths
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'compose.yml'
  pull_request:
    branches: dev
    paths: *frontend-ci-paths

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit --skipLibCheck

      - name: Unit Test (Vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

  e2e-test:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build Services
        run: DOCKER_TARGET=runner docker compose build --no-cache

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jpeg-to-json-cicd-role
          aws-region: ap-northeast-1

      - name: Generate .env file
        shell: bash
        env:
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          APP_ENV: ${{ secrets.APP_ENV }}
          AWS_PROFILE: ${{ secrets.AWS_PROFILE }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_SDK_LOAD_CONFIG: ${{ secrets.AWS_SDK_LOAD_CONFIG }}
          INPUT_BUCKET_NAME: ${{ secrets.INPUT_BUCKET_NAME }}
          IS_LAMBDA: ${{ secrets.IS_LAMBDA }}
        run: |
          cat <<EOF > .env
          ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
          APP_ENV=${APP_ENV}
          AWS_LAMBDA_FUNCTION_NAME=
          AWS_PROFILE: ${{ secrets.AWS_PROFILE }}
          AWS_REGION=${AWS_REGION}
          AWS_SDK_LOAD_CONFIG: ${{ secrets.AWS_SDK_LOAD_CONFIG }}
          INPUT_BUCKET_NAME=${INPUT_BUCKET_NAME}
          IS_LAMBDA=${IS_LAMBDA}
          AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
          EOF

      - name: Start Services
        run: |
          docker compose -f compose.ci.yml up -d

          docker compose exec -T -u root frontend chmod -R 777 /workspace/frontend
          docker compose exec -T -u root frontend chown -R node:node /home/node/.npm

      - name: Run E2E Tests
        run: docker compose exec -T frontend npm run test:e2e

      - name: Debug Container Logs
        if: failure()
        run: docker compose logs frontend backend

      - name: Check Open Ports
        if: failure()
        run: docker compose exec -T backend ss -tuln || docker compose exec -T backend netstat -tuln

      - name: Debug Inside Container
        if: failure()
        run: |
          docker compose exec -T backend ps aux
          docker compose exec -T backend ls -l /workspace/backend

      - name: Check Backend SSO Status
        if: failure()
        run: |
          echo "Checking backend SSO/Auth status..."
          docker compose exec -T backend aws sts get-caller-identity || echo "AWS Authentication failed in backend container"

      - name: Inspect Network Configuration
        if: failure()
        run: |
          echo "--- 1. Check all containers ---"
          docker compose ps -a

          echo "--- 2. Frontend IP Address ---"
          FRONTEND_CONTAINER=$(docker compose ps -q frontend)
          [ -n "$FRONTEND_CONTAINER" ] && docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $FRONTEND_CONTAINER

          echo "--- 3. DNS Resolution Check (inside frontend) ---"
          docker compose exec -T frontend nslookup backend || echo "nslookup backend failed"

          echo "--- 4. Network Bridge Details ---"
          docker network inspect app-network
