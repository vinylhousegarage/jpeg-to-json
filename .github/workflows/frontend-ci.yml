name: Frontend CI

on:
  push:
    branches: dev
    paths: &frontend-ci-paths
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: dev
    paths: *frontend-ci-paths

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit --skipLibCheck

      - name: Unit Test (Vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

  e2e-test:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Start Backend
        run: docker compose up -d backend
        env:
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          INPUT_BUCKET_NAME: ${{ secrets.INPUT_BUCKET_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_LAMBDA_FUNCTION_NAME: ""

      - name: Install
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Get Playwright Version
        id: playwright-version
        run: |
          VERSION=$(node -e "console.log(require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version)")
          echo "PLAYWRIGHT_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
        working-directory: frontend

      - name: Run E2E Tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8080
