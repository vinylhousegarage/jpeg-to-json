name: Frontend CI

on:
  push:
    branches: dev
    paths: &frontend-ci-paths
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'compose.yml'
  pull_request:
    branches: dev
    paths: *frontend-ci-paths

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit --skipLibCheck

      - name: Unit Test (Vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

  e2e-test:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Start Services
        env:
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          INPUT_BUCKET_NAME: ${{ secrets.INPUT_BUCKET_NAME }}
        run: |
          mkdir -p backend
          touch backend/.env
          docker compose up -d

      - name: Fix permissions
        run: |
          sudo chown -R $USER:$USER .

      - name: Wait for Frontend Service
        run: |
          TARGET_URL="http://127.0.0.1:8081"
          echo "Waiting for Docker-based server to be ready on $TARGET_URL..."
          for i in {1..20}; do
            if curl -s $TARGET_URL > /dev/null; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Waiting... ($i/20)"
            sleep 5
          done
          echo "::error::Server failed to start."
          docker compose logs backend frontend
          exit 1

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Get Playwright Version
        id: playwright-version
        run: |
          VERSION=$(node -e "console.log(require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version)")
          echo "PLAYWRIGHT_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
        working-directory: frontend

      - name: Run E2E Tests
        run: npx playwright test
        working-directory: frontend
