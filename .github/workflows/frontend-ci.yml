name: Frontend CI

on:
  push:
    branches: dev
    paths: &frontend-ci-paths
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'compose.yml'
  pull_request:
    branches: dev
    paths: *frontend-ci-paths

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit --skipLibCheck

      - name: Unit Test (Vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

  e2e-test:
    needs: test-and-build
    runs-on: ubuntu-latest
    env:
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      APP_ENV: ${{ secrets.APP_ENV }}
      AWS_LAMBDA_FUNCTION_NAME: ""
      AWS_PROFILE: ${{ secrets.AWS_PROFILE }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SDK_LOAD_CONFIG: ${{ secrets.AWS_SDK_LOAD_CONFIG }}
      BASE_URL: http://127.0.0.1:8081
      INPUT_BUCKET_NAME: ${{ secrets.INPUT_BUCKET_NAME }}
      IS_LAMBDA: ${{ secrets.IS_LAMBDA }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Services
        run: |
          docker compose build

      - name: Start Services
        run: |
          docker compose up -d
          docker compose exec -T -u root frontend chmod -R 777 /workspace/frontend
          docker compose exec -T -u root frontend chown -R node:node /home/node/.npm

      - name: Wait for Frontend Service
        run: |
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8081 > /dev/null; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Debug Container Logs
        if: failure()
        run: docker compose logs frontend

      - name: Check Open Ports
        if: failure()
        run: docker compose exec -T frontend ss -tuln || docker compose exec -T frontend netstat -tuln

      - name: Debug Inside Container
        if: failure()
        run: |
          docker compose exec -T frontend ps aux
          docker compose exec -T frontend ls -l /app

      - name: Check Backend SSO Status
        if: failure()
        run: |
          echo "Checking backend SSO/Auth status..."
          docker compose exec -T backend  aws sts get-caller-identity || echo "AWS Authentication failed in backend container"

      - name: Run E2E Tests
        run: docker compose exec -T frontend npm run test:e2e

      - name: Setup tmate session
        if: failure()
        uses: mxschmitt/action-tmate@v3
