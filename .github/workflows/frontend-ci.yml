name: Frontend CI

on:
  push:
    branches: dev
    paths: &frontend-ci-paths
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'compose.yml'
  pull_request:
    branches: dev
    paths: *frontend-ci-paths

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit --skipLibCheck

      - name: Unit Test (Vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

  e2e-test:
    needs: test-and-build
    runs-on: ubuntu-latest
    env:
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      AWS_LAMBDA_FUNCTION_NAME: ""
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BASE_URL: http://127.0.0.1:8081
      INPUT_BUCKET_NAME: ${{ secrets.INPUT_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Start Services
        run: docker compose up -d

      - name: Wait for Frontend Service
        run: |
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8081 > /dev/null; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Run E2E Tests
        run: docker compose exec -T frontend npm run test:e2e
