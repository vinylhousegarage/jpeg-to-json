name: Frontend CI

on:
  push:
    branches: dev
    paths: &frontend-ci-paths
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'compose.yml'
  pull_request:
    branches: dev
    paths: *frontend-ci-paths

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit --skipLibCheck

      - name: Unit Test (Vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

  e2e-test:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build Services
        run: docker compose build --no-cache

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jpeg-to-json-cicd-role
          aws-region: ap-northeast-1

      - name: Generate .env file
        shell: bash
        run: |
          cat <<EOF > .env
          APP_ENV=${{ secrets.APP_ENV }}
          AWS_LAMBDA_FUNCTION_NAME=
          AWS_PROFILE=
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_SDK_LOAD_CONFIG=${{ secrets.AWS_SDK_LOAD_CONFIG }}
          BEDROCK_MODEL_ID=${{ secrets.BEDROCK_MODEL_ID }}
          INPUT_BUCKET_NAME=${{ secrets.INPUT_BUCKET_NAME }}
          IS_LAMBDA=${{ secrets.IS_LAMBDA }}
          PROMPT_FILE_NAME=${{ secrets.PROMPT_FILE_NAME }}
          AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
          EOF

      - name: Start Services
        run: |
          mkdir -p backend/tmp
          chmod 777 backend/tmp

          docker compose up -d

          docker compose exec -T -u root backend chmod -R 777 /workspace/backend/tmp
          docker compose exec -T -u root backend chown -R appuser:appgroup /workspace/backend

          docker compose exec -T -u root frontend chmod -R 777 /workspace/frontend
          docker compose exec -T -u root frontend chown -R node:node /home/node/.npm

      - name: Wait for Services
        run: |
          echo "Waiting for backend to build and start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/presign > /dev/null || [ $? -eq 7 ]; then
              nc -z localhost 8080 && break
            fi
            sleep 2
          done
          sleep 5

      - name: Run E2E Tests
        run: docker compose exec -T frontend npm run test:e2e

      - name: Debug Backend Status
        if: failure()
        run: |
          echo "--- Inspecting running processes and network ---"
          ls -l /proc/1/exe || echo "Process 1 not found"

          docker compose logs backend

      - name: Debug Container Logs
        if: failure()
        run: docker compose logs frontend backend

      - name: Inspect Network Configuration
        if: failure()
        run: |
          echo "--- 1. Check all containers ---"
          docker compose ps -a

          echo "--- 2. Frontend IP Address ---"
          FRONTEND_CONTAINER=$(docker compose ps -q frontend)
          [ -n "$FRONTEND_CONTAINER" ] && docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $FRONTEND_CONTAINER

          echo "--- 3. Network Bridge Details ---"
          docker network inspect app-network
