name: Backend CI

on:
  pull_request:
    branches: dev
    paths:
      - 'backend/**'
      - '.github/workflows/backend-dev-ci.yml'


jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Install dependencies
        run: go mod tidy

      - name: Run Linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: ./backend

      - name: Run tests
        run: go test ./...

      - name: Build Presign Handler (Dry Run)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -tags lambda.norpc -trimpath -ldflags="-s -w" \
          -o bin/presign/bootstrap ./cmd/presign/main.go
