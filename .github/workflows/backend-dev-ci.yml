name: Backend CI

on:
  push:
    branches: dev
    paths:
      - 'backend/**'
      - '.github/workflows/backend-dev-ci.yml'
  pull_request:
    branches: dev
    paths:
      - 'backend/**'
      - '.github/workflows/backend-dev-ci.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ runner.os }}-golangci-lint-v1.64.8

      - name: Install dependencies
        run: go mod tidy

      - name: Install/Verify golangci-lint
        run: |
          if [ ! -f ~/go/bin/golangci-lint ]; then
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          fi

      - name: Run Linter
        run: $(go env GOPATH)/bin/golangci-lint run ./... --timeout 5m

      - name: Run tests
        run: go test ./...

      - name: Build Presign Handler (Dry Run)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -tags lambda.norpc -trimpath -ldflags="-s -w" \
          -o bin/presign/bootstrap ./cmd/presign/main.go
