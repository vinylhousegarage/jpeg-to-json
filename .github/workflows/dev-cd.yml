name: Dev CD

on:
  push:
    branches:
      - dev
    paths:
      - 'infra/**'
      - '.github/workflows/dev-cd.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # 1. バックエンドのビルド
      # ==========================================
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Build Presign Handler
        working-directory: ./backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -tags lambda.norpc -trimpath -ldflags="-s -w" \
          -o bin/presign/bootstrap ./cmd/presign/main.go

      # ==========================================
      # 2. インフラのデプロイ（Hotswap対応）
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jpeg-to-json-cicd-role
          aws-region: ap-northeast-1

      - name: Build
        run: npm run build

      - name: CDK Deploy to Dev
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: npx cdk deploy Dev-InfraStack --require-approval never
