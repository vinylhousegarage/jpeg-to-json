name: Dev CI

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/dev-cd.yml'
      - '.github/workflows/dev-ci.yml'

permissions:
  id-token: write
  contents: read

jobs:
  # ==========================================
  # 1. バックエンドのテスト
  # ==========================================
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout 5m
          working-directory: ./backend
          install-mode: goinstall

      - name: Run tests
        run: go test ./...

  # ==========================================
  # 2. インフラのテストとCDK Diff
  # ==========================================
  test-infra:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Build Presign Handler
        working-directory: ./backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -tags lambda.norpc -trimpath -ldflags="-s -w" \
          -o bin/presign/bootstrap ./cmd/presign/main.go

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./infra
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jpeg-to-json-cicd-role
          aws-region: ap-northeast-1

      - name: Lint
        working-directory: ./infra
        run: npm run lint

      - name: Build
        working-directory: ./infra
        run: npm run build

      - name: CDK Synth
        working-directory: ./infra
        run: npx cdk synth

      - name: CDK Diff
        working-directory: ./infra
        run: npx cdk diff
