services:
  infra:
    build:
      context: ./infra
    container_name: cdk
    working_dir: /workspace/infra
    volumes:
      - .:/workspace
      - ~/.aws:/home/node/.aws
    command: sleep infinity
    tty: true
    stdin_open: true

  backend:
    build:
      context: ./backend
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: go
    volumes:
      - .:/workspace
      - ~/.aws:/home/appuser/.aws
    ports:
      - "8080:8080"
    environment:
      - INPUT_BUCKET_NAME=${INPUT_BUCKET_NAME}
